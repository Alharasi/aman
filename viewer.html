<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="عارض ملف PMO Portfolio Toolkit داخل المتصفح.">
  <meta name="author" content="Ibrahim Alharrasi">
  <meta name="theme-color" content="#f7f7f5">
  <title>عارض الملف | pmo.guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="viewer-page">
  <header class="viewer-topbar">
    <a class="latin viewer-brand" href="index.html">pmo.guide</a>
    <div class="viewer-actions">
      <label class="button primary compact" for="excel-file">اختيار ملف Excel</label>
      <input id="excel-file" type="file" accept=".xlsx,.xls" hidden>
      <button id="reset-file" class="button secondary compact" type="button">إغلاق الملف</button>
    </div>
  </header>

  <main class="workspace-shell">
    <section class="upload-state" id="upload-state">
      <h1>عرض ملف المشاريع</h1>
      <p>اختر ملف PMO Portfolio Toolkit من جهازك لعرض بياناته في مساحة كاملة.</p>
      <label class="button primary" for="excel-file">اختيار ملف Excel</label>
      <p class="privacy">يُقرأ الملف محليًا داخل المتصفح ولا يتم رفع بياناته إلى الموقع.</p>
      <p id="file-status" class="file-status" role="status" aria-live="polite"></p>
    </section>

    <section id="viewer" class="viewer full-viewer" hidden aria-label="عرض المشاريع">
      <div class="viewer-head">
        <div>
          <small>عرض الملف</small>
          <h2>محفظة المشاريع</h2>
        </div>
        <p id="active-file" class="active-file latin"></p>
      </div>

      <div id="summary" class="summary"></div>

      <div class="viewer-layout">
        <div class="projects-card">
          <div class="list-head"><span>المشروع</span><span>الإنجاز</span><span>الصحة</span></div>
          <div id="project-list" class="project-list"></div>
        </div>
        <article id="project-detail" class="project-detail empty-detail">
          <div class="empty-detail-copy">اختر مشروعًا من القائمة لعرض تفاصيله.</div>
        </article>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="assets/viewer.js"></script>
</body>
</html>
